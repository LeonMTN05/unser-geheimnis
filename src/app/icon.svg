<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0a0e1a"/>
  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="7" fill="url(#glow)" opacity="0.4"/>
  <!-- Lock shackle -->
  <path d="M10.5 14.5v-3.5a5.5 5.5 0 0 1 11 0v3.5" fill="none" stroke="#06d6a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lock body -->
  <rect x="7.5" y="14.5" width="17" height="12" rx="2.5" fill="#06d6a0"/>
  <!-- Keyhole circle -->
  <circle cx="16" cy="20" r="2" fill="#0a0e1a"/>
  <!-- Keyhole slot -->
  <rect x="14.8" y="20" width="2.4" height="3.5" rx="1.2" fill="#0a0e1a"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
